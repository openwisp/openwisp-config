name: OpenWISP Config CI Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: QA-Checks and Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Dependencies
        id: deps
        run: |
          sudo ./install-dev.sh
          pip install --upgrade -r requirements-test.txt

      - name: QA-Checks
        run: ./run-qa-checks
        env:
          CI: 1

      - name: Run sh-checker
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: ./runtests

  build:
    name: Build and Upload Packages
    needs: tests
    runs-on: ubuntu-24.04
    env:
      BUILD_DIR: "/home/runner/work/build"
      DOWNLOADS_DIR: "/home/runner/work/downloads"
      CORES: 2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Cache OpenWrt dependencies
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          cache-name: cache-openwrt-dependencies
        with:
          path: "/home/runner/work/build"
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('runbuild') }}

      - name: Set Environment
        run: |
          echo "START_TIME=$(date +"%Y-%m-%d")" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=$(git log --pretty=format:'%h' -n 1)" >> "$GITHUB_ENV"

      - name: Run Build
        run: ./runbuild
        env:
          CI: 1
          CI_CACHE: ${{ steps.cache.outputs.cache-hit }}
          OPENWRT_APK_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.OPENWRT_APK_PRIVATE_KEY || '' }}

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Packages
          path: "${{ env.DOWNLOADS_DIR }}/${{ env.START_TIME }}"

      - name: Google Cloud Auth
        if: ${{ github.event_name=='push' && github.ref == 'refs/heads/master' }}
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3
        with:
          project_id: ${{ secrets.GCS_PROJECT_ID }}
          credentials_json: ${{ secrets.GCS_DOWNLOADS_SERVICE_ACCOUNT_JSON }}

      - name: Google Cloud Setup
        if: ${{ github.event_name=='push' && github.ref == 'refs/heads/master' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCS_PROJECT_ID }}

      - name: Upload compiled packages to downloads.openwisp.io
        if: ${{ github.event_name=='push' && github.ref == 'refs/heads/master' }}
        run: |
          gcloud storage rsync --recursive "$SRC_URL" "$DST_URL"
          gcloud storage rsync --recursive --delete-unmatched-destination-objects "$SRC_URL" "$LATEST_URL"
        env:
          SRC_URL: ${{ env.DOWNLOADS_DIR }}/${{ env.START_TIME }}/openwisp
          DST_URL: gs://${{ secrets.GCS_DOWNLOADS_BUCKET_NAME }}/openwisp-config/${{ env.START_TIME }}-${{ env.COMMIT_SHA }}
          LATEST_URL: gs://${{ secrets.GCS_DOWNLOADS_BUCKET_NAME }}/openwisp-config/latest

      - name: Delete compiled packages older than two years
        if: ${{ success() && github.event_name=='push' }}
        shell: bash
        run: |
          # Propagate failures from gcloud storage ls through the loop.
          set -o pipefail
          cutoff=$(date -u -d '2 years ago' +%F)
          gcloud storage ls "$BASE_URL/" | while IFS= read -r path; do
            # Retain only the direct child directory name.
            dir_name=${path#"$BASE_URL/"}
            dir_name=${dir_name%/}
            date=${dir_name:0:10}
            # Only dated build directories with a commit SHA match.
            if [[ $dir_name =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]+$ ]] && [[ $date < $cutoff ]]; then
              if ! gcloud storage rm --recursive "$path"; then
                exit 1
              fi
            fi
          done
        env:
          BASE_URL: gs://${{ secrets.GCS_DOWNLOADS_BUCKET_NAME }}/openwisp-config
